plugins { id 'com.android.application' }

android {
    namespace 'es.quinielaaistudio.escrutinio'
    compileSdk 35
    defaultConfig {
        applicationId 'es.quinielaaistudio.escrutinio'
        minSdk 23
        targetSdk 33
        versionCode 13
        versionName '0.5.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
